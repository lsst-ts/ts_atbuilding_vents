[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ts_atbuilding_vents"
description = "AT dome vent controller for `Vera C. Rubin Observatory <https://lsst.org>`_."
license = { text = "GPL" }
classifiers = [ "Programming Language :: Python :: 3" ]
urls = { source_code = "https://github.com/lsst-ts/ts_atbuilding_vents"}
dynamic = ["version"]
dependencies = [ "backoff", "pymodbus", "smbus3" ]

[tool.setuptools.dynamic]
version = { attr = "setuptools_scm.get_version" }

[tool.setuptools.packages.find]
where = ["python"]

[project.scripts]
run_dispatcher = "lsst.ts.vent.controller.run_dispatcher:main"

[tool.setuptools_scm]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = ["documenteer[pipelines]"]
